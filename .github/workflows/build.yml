name: Build WaveBombz WASP
on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        name: Checkout
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build VST3 and Standalone
        run: cmake --build build --config Release --parallel 2
      - name: Locate VST3
        id: vst3
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build -Recurse -Directory -Filter "WaveBombz WASP.vst3" | Select-Object -First 1
          if (-not $plugin) { throw "VST3 bundle not found after build." }
          "plugin_path=$($plugin.FullName)" >> $env:GITHUB_OUTPUT
      - name: Download pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip" -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval -Force
      - name: Validate VST3 lifecycle and editor
        shell: pwsh
        run: |
          $exe = Get-ChildItem pluginval -Recurse -File -Filter "pluginval.exe" | Select-Object -First 1
          if (-not $exe) { throw "pluginval.exe not found in downloaded archive." }
          New-Item -ItemType Directory -Force -Path pluginval-logs | Out-Null
          "pluginval executable: $($exe.FullName)" | Set-Content pluginval-logs/diagnostics.txt
          "VST3 path: ${{ steps.vst3.outputs.plugin_path }}" | Add-Content pluginval-logs/diagnostics.txt
          $pluginPath = "${{ steps.vst3.outputs.plugin_path }}"
          $arguments = @("--strictness-level", "5", "--output-dir", "$PWD/pluginval-logs", "`"$pluginPath`"")
          $proc = Start-Process -FilePath $exe.FullName -ArgumentList $arguments -NoNewWindow -Wait -PassThru -RedirectStandardOutput "$PWD/pluginval-logs/stdout.txt" -RedirectStandardError "$PWD/pluginval-logs/stderr.txt"
          "pluginval exit code: $($proc.ExitCode)" | Add-Content pluginval-logs/diagnostics.txt
          if (Test-Path pluginval-logs/stdout.txt) { Get-Content pluginval-logs/stdout.txt | Add-Content pluginval-logs/diagnostics.txt }
          if (Test-Path pluginval-logs/stderr.txt) { Get-Content pluginval-logs/stderr.txt | Add-Content pluginval-logs/diagnostics.txt }
          if ($proc.ExitCode -ne 0) { throw "pluginval failed with exit code $($proc.ExitCode). See uploaded pluginval logs." }
      - name: Upload pluginval logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WaveBombz-WASP-pluginval-logs
          path: pluginval-logs/**
          if-no-files-found: ignore
      - name: Collect VST3
        if: success()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $plugin = Get-ChildItem -Path build -Recurse -Directory -Filter "WaveBombz WASP.vst3" | Select-Object -First 1
          if (-not $plugin) { throw "VST3 bundle not found after validation." }
          Copy-Item $plugin.FullName dist -Recurse -Force
          if (Test-Path "Soundbanks") { Copy-Item "Soundbanks" "dist/Soundbanks" -Recurse -Force }
          Compress-Archive -Path dist/* -DestinationPath WaveBombz-WASP-Windows-VST3.zip -Force
      - uses: actions/upload-artifact@v4
        name: Upload VST3 artifact
        if: success()
        with:
          name: WaveBombz-WASP-Windows-VST3
          path: WaveBombz-WASP-Windows-VST3.zip
          if-no-files-found: error
